name: mangaloader
description: "Manga Loader"
publish_to: 'none'

version: 1.6.3+22

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_mangaloader:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_picker: 10.0.0
  window_manager: ^0.5.2
  battery_plus: 6.2.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 48
  image_path: "assets/icon_monet.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon_monet.png"
  adaptive_icon_monochrome: "assets/icon_monet.png"
