name: Build & Release MangaLoader

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build and publish. Leave empty to build main as a dev release.'
        required: false
        default: ''

# Caches are scoped per ref, so a build triggered by a tag would start cold on
# every release. Tags therefore only dispatch this workflow on main, where all
# releases share one cache scope.
concurrency:
  group: release-${{ inputs.release_tag || 'dev-latest' }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargokit builds into build/, never into rust/target, so only the crate
      # registry is worth caching here.
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-windows-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-windows-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Cache Cargokit Build Directory
        uses: actions/cache@v4
        with:
          path: build/windows/x64/plugins/rust_lib_mangaloader/cargokit_build
          key: cargokit-windows-${{ hashFiles('rust/Cargo.lock', 'rust_builder/**') }}
          restore-keys: |
            cargokit-windows-

      - name: Verify Generated Bindings
        shell: pwsh
        run: |
          foreach ($path in @('rust/src/frb_generated.rs', 'lib/src/rust/frb_generated.dart')) {
            if (-not (Test-Path $path)) {
              throw "Missing $path - run flutter_rust_bridge_codegen generate and commit the result"
            }
          }

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath mangaloader-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangaloader-windows-x64
          path: mangaloader-windows-x64.zip

  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # cargokit builds into build/, never into rust/target, so only the crate
      # registry is worth caching here.
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-ubuntu-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-ubuntu-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      # AGP installs this exact NDK into the SDK on demand; caching that directory
      # is what keeps it from being downloaded on every run.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-${{ runner.os }}

      - name: Cache Cargokit Build Directory
        uses: actions/cache@v4
        with:
          path: build/rust_lib_mangaloader
          key: cargokit-android-${{ hashFiles('rust/Cargo.lock', 'rust_builder/**') }}
          restore-keys: |
            cargokit-android-

      - name: Verify Generated Bindings
        run: |
          for path in rust/src/frb_generated.rs lib/src/rust/frb_generated.dart; do
            test -f "$path" || { echo "Missing $path - run flutter_rust_bridge_codegen generate and commit the result"; exit 1; }
          done

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Setup Android Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/mangaloader-release.jks
            echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'mangaloader2026' }}" > android/key.properties
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD || 'mangaloader2026' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS || 'mangaloader' }}" >> android/key.properties
            echo "storeFile=mangaloader-release.jks" >> android/key.properties
            echo "Release keystore configured from GitHub Secrets!"
          else
            echo "Generating dedicated production release keystore..."
            keytool -genkeypair -v -keystore android/app/mangaloader-release.jks -alias mangaloader -keyalg RSA -keysize 2048 -validity 10000 -storepass mangaloader2026 -keypass mangaloader2026 -dname "CN=MangaLoader, OU=Mobile, O=MangaLoader, L=Moscow, ST=Moscow, C=RU"
            echo "storePassword=mangaloader2026" > android/key.properties
            echo "keyPassword=mangaloader2026" >> android/key.properties
            echo "keyAlias=mangaloader" >> android/key.properties
            echo "storeFile=mangaloader-release.jks" >> android/key.properties
            echo "Production release keystore configured!"
          fi

      - name: Build Android Universal & Split APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare Standard APK Artifacts
        run: |
          mkdir -p apks
          cp build/app/outputs/flutter-apk/app-release.apk apks/mangaloader-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apks/mangaloader-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apks/mangaloader-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk apks/mangaloader-android-x86_64.apk

      - name: Build RuStore Compliant APK (without REQUEST_INSTALL_PACKAGES)
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          # RuStore takes arm64 only. Splitting is what actually restricts the
          # packaged native libraries; --target-platform alone still bundles every
          # ABI that cargokit built.
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=RUSTORE_BUILD=true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apks/mangaloader-android-arm64-v8a_rustore.apk
          git checkout android/app/src/main/AndroidManifest.xml

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mangaloader-android-artifacts
          path: apks/*.apk

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargokit builds into build/, never into rust/target, so only the crate
      # registry is worth caching here.
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-ubuntu-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-ubuntu-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Cache Cargokit Build Directory
        uses: actions/cache@v4
        with:
          # Flutter puts Linux plugin build dirs under the build-mode directory,
          # so the exact depth depends on the tool version; the glob stays valid.
          path: build/linux/**/cargokit_build
          key: cargokit-linux-${{ hashFiles('rust/Cargo.lock', 'rust_builder/**') }}
          restore-keys: |
            cargokit-linux-

      - name: Verify Generated Bindings
        run: |
          for path in rust/src/frb_generated.rs lib/src/rust/frb_generated.dart; do
            test -f "$path" || { echo "Missing $path - run flutter_rust_bridge_codegen generate and commit the result"; exit 1; }
          done

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Binary
        run: |
          tar -czf mangaloader-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangaloader-linux-x64
          path: mangaloader-linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: mangaloader-windows-x64
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mangaloader-android-artifacts
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: mangaloader-linux-x64
          path: release-assets

      - name: Generate Checksums (SHA-256)
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA-256 Checksums:"
          cat SHA256SUMS.txt

      - name: Determine Release Metadata
        id: rel_meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG_NAME="$RELEASE_TAG"
            VERSION_CLEAN="${TAG_NAME#v}"
            # Beta tags point at the numeric changelog section of their release line.
            VERSION_CLEAN="${VERSION_CLEAN%%-*}"
            if [[ "$TAG_NAME" == *"-beta"* || "$TAG_NAME" == *"-alpha"* || "$TAG_NAME" == *"-rc"* ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
              echo "release_title=${TAG_NAME} (Beta)" >> $GITHUB_OUTPUT
            else
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
              echo "release_title=${TAG_NAME}" >> $GITHUB_OUTPUT
            fi
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            
            if [ -f CHANGELOG.md ]; then
              awk -v ver="$VERSION_CLEAN" '
                BEGIN { recording=0; found=0 }
                /^## \[?[vV]?[0-9]/ {
                  if (index($0, ver) > 0) {
                    recording=1;
                    found=1;
                    next;
                  } else if (recording) {
                    exit;
                  }
                }
                recording { print }
                END { if (!found) exit 1 }
              ' CHANGELOG.md > release_notes.md || true
            fi
            if [ ! -s release_notes.md ]; then
              echo "Release notes for $TAG_NAME" > release_notes.md
            fi
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "tag_name=dev-latest" >> $GITHUB_OUTPUT
            echo "release_title=MangaLoader Dev Build (${GITHUB_SHA::7})" >> $GITHUB_OUTPUT
            echo "Автоматическая ночная сборка ветки main (коммит ${GITHUB_SHA::7}). Содержит самые свежие экспериментальные изменения." > release_notes.md
          fi
          cat release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag_name }}
          name: ${{ steps.rel_meta.outputs.release_title }}
          files: release-assets/*
          draft: false
          prerelease: ${{ steps.rel_meta.outputs.is_prerelease == 'true' }}
          body_path: release_notes.md
          generate_release_notes: false

  publish-rustore:
    name: Publish to RuStore
    if: inputs.release_tag != '' && !contains(inputs.release_tag, '-beta') && !contains(inputs.release_tag, '-alpha') && !contains(inputs.release_tag, '-rc')
    needs: [build-android]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RuStore Publish Dependencies
        run: pip install requests cryptography

      - name: Extract Release Notes for RuStore
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          VERSION_CLEAN="${TAG_NAME#v}"
          VERSION_CLEAN="${VERSION_CLEAN%%-*}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION_CLEAN" '
              BEGIN { recording=0; found=0 }
              /^## \[?[vV]?[0-9]/ {
                if (index($0, ver) > 0) {
                  recording=1;
                  found=1;
                  next;
                } else if (recording) {
                  exit;
                }
              }
              recording { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > rustore_notes.txt || true
          fi
          if [ ! -s rustore_notes.txt ]; then
            echo "Обновление MangaLoader $TAG_NAME: улучшение производительности и исправление ошибок." > rustore_notes.txt
          fi

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mangaloader-android-artifacts
          path: apks

      - name: Publish arm64-v8a APK to RuStore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          RUSTORE_PACKAGE_NAME: 'bshv.mangaloader.app'
          RUSTORE_APK_PATH: 'apks/mangaloader-android-arm64-v8a_rustore.apk'
        run: |
          export RUSTORE_WHATS_NEW="$(cat rustore_notes.txt)"
          python3 scripts/publish_rustore.py
